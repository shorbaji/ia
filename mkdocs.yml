site_name: insaali/ia
site_url: https://docs.insaali.com/ia/
site_description: Command-line client for insaali — simulation infrastructure for robotics.
repo_url: https://github.com/shorbaji/insaali
repo_name: shorbaji/insaali
edit_uri: edit/main/cli/docs/

docs_dir: docs

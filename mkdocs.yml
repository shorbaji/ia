site_name: insaali/ia
site_url: https://docs.insaali.com/ia/
site_description: Command-line client for insaali — simulation infrastructure for robotics.
repo_url: https://github.com/shorbaji/ia
repo_name: shorbaji/ia
# Edit links suppressed: docs source lives in shorbaji/insaali (this repo),
# but the displayed repo points to the public ia mirror, so per-page edit
# URIs would 404.
edit_uri: ""

docs_dir: docs
# Build into site/ia so the Cloudflare Worker (assets dir = cli/site)
# serves the docs under the /ia/ path on docs.insaali.com.
site_dir: site/ia

theme:
  name: material
  custom_dir: overrides
  # Match the web app's light look: white header, amber accent links.
  # The exact accent (#b45309) is enforced by stylesheets/extra.css.
  palette:
    primary: white
    accent: deep orange

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Install: install.md
  - Reference: reference.md
